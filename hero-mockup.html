<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Mockup — The Call with Nancy Sabato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root {
    --white: #fff;
    --dark: #3D3530;
    --tone: #F5EFE4;
    --mid: #9B8E82;
    --purple: #8B6BAE;
    --purple-dark: #74589A;
    --purple-light: #EDE7F6;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Lora', Georgia, serif;
    --font-script: 'Montserrat', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    color: var(--dark);
    background: var(--tone);
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    min-height: 88vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: var(--purple-light);
    text-align: center;
  }
  .hero-image {
    position: absolute;
    inset: 0;
    background-image: url("the-call-banner.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  /* Soft dark gradient at the bottom for legibility (desktop only) */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0) 45%,
      rgba(40,30,55,0.18) 65%,
      rgba(40,30,55,0.55) 100%
    );
    pointer-events: none;
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    padding: 0 48px 140px;
  }

  .overline {
    font-family: var(--font-script);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.9;
    margin-bottom: 20px;
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .hero h1 {
    font-family: var(--font-display);
    font-weight: 400;
    color: var(--white);
    font-size: clamp(40px, 6.5vw, 84px);
    letter-spacing: -2px;
    line-height: 1.05;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }
  .hero h1 em { font-style: italic; color: #F5EFE4; }
  .hero h1 .nowrap { white-space: nowrap; }

  @media (max-width: 900px) {
    .hero-image { background-position: 55% center; }
    .hero-inner { padding: 0 24px 120px; }
  }

  /* ── Mobile: stacked — image on top, text in a clean band below ── */
  @media (max-width: 600px) {
    .hero {
      min-height: auto;
      display: block;
    }
    .hero-image {
      position: relative;
      inset: auto;
      width: 100%;
      aspect-ratio: 4 / 5;
      background-position: 55% 20%;
    }
    .hero::after { display: none; }
    .hero-inner {
      padding: 48px 24px 56px;
      background: var(--purple-light);
    }
    .overline {
      color: var(--mid);
      opacity: 1;
      text-shadow: none;
      font-size: 11px;
      letter-spacing: 2.5px;
    }
    .hero h1 {
      color: var(--dark);
      text-shadow: none;
      letter-spacing: -1px;
    }
    .hero h1 em { color: var(--purple-dark); }
  }

  /* ── Nav (mirrors theme) ── */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    border-bottom: 1px solid #E2D8CA;
    box-shadow: 0 2px 32px rgba(61,53,48,0.07);
    height: 64px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 48px;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; letter-spacing: -0.5px;
    color: #000; text-decoration: none;
    white-space: nowrap;
    line-height: 1;
  }
  .nav-links { display: flex; gap: 32px; align-items: center; list-style: none; padding: 0; margin: 0; }
  .nav-links a {
    font-family: var(--font-body); font-size: 14px;
    color: var(--dark); text-decoration: none;
  }
  @media (max-width: 600px) {
    .nav { padding: 0 20px; }
    .nav-logo { font-size: 18px; }
    .nav-links { display: none; }
  }

  /* ── Note bar (mockup only) ── */
  .note {
    background: var(--white);
    border-top: 1px solid #E2D8CA;
    padding: 18px 24px;
    text-align: center;
    font-family: var(--font-script);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--mid);
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="nav-logo">The Call with Nancy Sabato</a>
  <ul class="nav-links">
    <li><a href="#">About</a></li>
    <li><a href="#">Newsletter</a></li>
    <li><a href="#">Contact</a></li>
    <li><a href="#">Watch Now</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-image" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="overline">A ministry for the real and the weary</div>
    <h1>faith in the middle of <span class="nowrap"><em>real</em> life.</span></h1>
  </div>
</section>

<div class="note">Mockup — homepage hero with banner background</div>

</body>
</html>
