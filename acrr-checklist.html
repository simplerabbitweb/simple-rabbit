02Fstyle>\n<style>\n  :root {\n    --violet-deep: #2D3154;\n    --violet-mid:  #474D73;\n    --paper:       #FDFAF7;\n    --paper-warm:  #F5F0EB;\n    --ink:         #0A0905;\n    --muted:       #7A756E;\n    --rose:        #AA737D;\n    --rule:        rgba(0,0,0,0.10);\n    --rule-on-dark: rgba(255,255,255,0.14);\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: #E9E3D9;\n    color: var(--ink);\n    font-family: \"DM Sans\", system-ui, sans-serif;\n    font-size: 15px;\n    line-height: 1.6;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  /* No rounded corners anywhere */\n  * { border-radius: 0 !important; }\n\n  /* sheet ------------------------------------------------------------ */\n  .desk {\n    min-height: 100vh;\n    padding: 48px 24px 96px;\n    display: flex;\n    justify-content: center;\n  }\n  .sheet {\n    width: 100%;\n    max-width: 780px;\n    background: var(--paper);\n    box-shadow:\n      0 1px 0 rgba(0,0,0,0.04),\n      0 30px 60px -20px rgba(20, 18, 35, 0.20);\n    /* shadow is acceptable here as it's a page-on-desk affordance, not a UI shadow.\n       Print/PDF strips it via @media print. */\n  }\n\n  /* Type tokens ------------------------------------------------------ */\n  .eyebrow {\n    font-family: \"DM Sans\", sans-serif;\n    font-size: 11px;\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: 2.5px;\n    color: var(--muted);\n  }\n  .eyebrow.on-dark { color: rgba(255,255,255,0.65); }\n  .eyebrow.rose { color: var(--rose); }\n\n  h1, h2, h3, .display {\n    font-family: \"Instrument Serif\", \"Times New Roman\", serif;\n    font-weight: 400;\n    color: var(--ink);\n    letter-spacing: -0.005em;\n    margin: 0;\n  }\n  h1 { font-size: 64px; line-height: 1.02; font-weight: 400; }\n  h2 { font-size: 40px; line-height: 1.08; font-weight: 400; }\n  h3 { font-size: 26px; line-height: 1.15; font-weight: 400; }\n\n  .deck {\n    font-family: \"Instrument Serif\", serif;\n    font-style: italic;\n    color: var(--muted);\n    font-size: 22px;\n    line-height: 1.4;\n  }\n  p { margin: 0; }\n\n  /* the ACRR letters - bold + underline wherever they appear in label */\n  .acrr-mark { letter-spacing: 0.02em; }\n  .acrr-mark b {\n    font-weight: 700;\n    text-decoration: underline;\n    text-underline-offset: 3px;\n    text-decoration-thickness: 1px;\n  }\n\n  /* HEADER (deep violet) -------------------------------------------- */\n  .topbar {\n    background: var(--violet-deep);\n    color: var(--paper);\n    padding: 22px 56px;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    border-bottom: 1px solid var(--rule-on-dark);\n  }\n  .brand {\n    display: flex; align-items: center; gap: 12px;\n    color: var(--paper);\n  }\n  .brand-mark {\n    width: 28px; height: 28px;\n    background: var(--paper);\n    color: var(--violet-deep);\n    display: grid; place-items: center;\n    font-family: \"Instrument Serif\", serif;\n    font-style: italic;\n    font-size: 18px;\n    line-height: 1;\n    padding-bottom: 2px;\n  }\n  .brand-name {\n    font-family: \"Instrument Serif\", serif;\n    font-size: 22px;\n    line-height: 1;\n  }\n  .brand-name em {\n    font-style: italic;\n    color: rgba(255,255,255,0.7);\n  }\n  .topbar .meta {\n    font-family: \"DM Sans\";\n    font-size: 11px;\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: 2.5px;\n    color: rgba(255,255,255,0.65);\n  }\n\n  /* COVER ----------------------------------------------------------- */\n  .cover {\n    padding: 56px 56px 64px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .cover-header {\n    display: flex;\n    align-items: center;\n    margin-bottom: 64px;\n  }\n  .cover-logo {\n    height: 56px;\n    width: auto;\n    display: block;\n  }\n  .cover-meta {\n    font-family: \"DM Sans\";\n    font-size: 11px;\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: 2.5px;\n    color: var(--muted);\n  }\n  .cover .eyebrow { display: block; margin-bottom: 28px; }\n  .cover h1 .em-rose { color: var(--rose); font-style: italic; }\n  .cover .deck { margin-top: 28px; max-width: 540px; }\n\n  .cover-grid {\n    margin-top: 64px;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 0;\n    border-top: 1px solid var(--rule);\n  }\n  .cover-grid > div {\n    padding: 24px 0;\n  }\n  .cover-grid > div + div {\n    border-left: 1px solid var(--rule);\n    padding-left: 24px;\n  }\n  .cover-grid .label {\n    display: block;\n    margin-bottom: 10px;\n  }\n  .cover-grid .value {\n    font-family: \"Instrument Serif\", serif;\n    font-size: 22px;\n    line-height: 1.3;\n    color: var(--ink);\n  }\n  .cover-grid .value em { font-style: italic; color: var(--violet-mid); }\n\n  /* INSTRUCTIONS BAND ----------------------------------------------- */\n  .instructions {\n    background: var(--paper-warm);\n    padding: 36px 56px;\n    border-bottom: 1px solid var(--rule);\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 32px;\n    align-items: center;\n  }\n  .instructions .copy { max-width: 380px; }\n  .instructions .copy .eyebrow { display: block; margin-bottom: 10px; }\n  .instructions .copy .text {\n    font-family: \"Instrument Serif\", serif;\n    font-size: 22px;\n    line-height: 1.35;\n    color: var(--ink);\n  }\n  .instructions .copy .text em { font-style: italic; color: var(--violet-mid); }\n\n  .scale-key {\n    display: flex;\n    align-items: center;\n    gap: 4px;\n  }\n  .scale-key .scale-cell {\n    width: 36px; height: 36px;\n    border: 1px solid var(--ink);\n    background: var(--paper);\n    display: grid; place-items: center;\n    font-family: \"Instrument Serif\", serif;\n    font-style: italic;\n    font-size: 18px;\n    color: var(--ink);\n  }\n  .scale-key .scale-cell.filled {\n    background: var(--violet-deep);\n    color: var(--paper);\n    border-color: var(--violet-deep);\n  }\n  .scale-key .endcap {\n    font-family: \"DM Sans\"; font-size: 10px;\n    text-transform: uppercase; letter-spacing: 2px;\n    color: var(--muted);\n    line-height: 1.2;\n    display: flex; flex-direction: column;\n    padding: 0 10px;\n  }\n  .scale-key .endcap b { color: var(--ink); font-weight: 500; }\n  .scale-key .endcap.right { text-align: right; }\n\n  /* SECTION --------------------------------------------------------- */\n  .section {\n    padding: 64px 56px 48px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .section-head {\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 24px;\n    align-items: end;\n    margin-bottom: 40px;\n  }\n  .section-head .lhs { display: flex; flex-direction: column; gap: 16px; }\n  .section-head .marker {\n    display: flex;\n    align-items: baseline;\n    gap: 14px;\n  }\n  .section-head .marker .num {\n    font-family: \"DM Sans\"; font-size: 11px;\n    font-weight: 500;\n    letter-spacing: 2.5px;\n    text-transform: uppercase;\n    color: var(--rose);\n  }\n  .section-head .marker .pillar-label {\n    font-family: \"DM Sans\"; font-size: 11px;\n    font-weight: 500;\n    letter-spacing: 2.5px;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .section-head h2 .lede {\n    font-style: italic;\n    color: var(--violet-mid);\n  }\n  .section-score {\n    text-align: right;\n    font-family: \"DM Sans\";\n    font-size: 11px;\n    font-weight: 500;\n    letter-spacing: 2.5px;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .section-score .val {\n    display: block;\n    font-family: \"Instrument Serif\", serif;\n    font-style: italic;\n    font-size: 36px;\n    line-height: 1;\n    color: var(--ink);\n    letter-spacing: 0;\n    text-transform: none;\n    margin-top: 8px;\n  }\n  .section-score .val .max { color: var(--muted); font-size: 24px; }\n\n  /* ITEM ROW -------------------------------------------------------- */\n  .item {   <\u002Fdiv>\n        <div class=\"band\" data-band=\"good\">\n          <div class=\"range\">30–39<\u002Fdiv>\n          <div class=\"desc\"><strong>Good but leaky<\u002Fstrong> — the bones are there. Tighten a handful of conversion points and the next quarter looks very different.<\u002Fdiv>\n          <div class=\"verdict\">Opportunities Exist<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"band\" data-band=\"average\">\n          <div class=\"range\">20–29<\u002Fdiv>\n          <div class=\"desc\"><strong>Average<\u002Fstrong> — significant growth potential. A focused 90-day rebuild on two pillars usually unlocks the rest.<\u002Fdiv>\n          <div class=\"verdict\">Growth Potential<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"band\" data-band=\"gaps\">\n          <div class=\"range\">Below 20<\u002Fdiv>\n          <div class=\"desc\"><strong>Major gaps<\u002Fstrong> — let's talk. Most of this is fixable faster than you think, and almost never alone.<\u002Fdiv>\n          <div class=\"verdict\">Let's Talk<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"your-score\">\n        <div class=\"label-block\">\n          <span class=\"label\">Your Total<\u002Fspan>\n          <div class=\"total\"><span id=\"total-score\">0<\u002Fspan><span class=\"max\">/90<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"verdict-line\" id=\"verdict-line\">Rate the items above to see where you land.<\u002Fdiv>\n        <div class=\"actions\">\n          <button class=\"btn\" id=\"reset-btn\" type=\"button\">Reset<\u002Fbutton>\n          <button class=\"btn primary\" id=\"print-btn\" type=\"button\">Save as PDF<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- CTA -->\n    <section class=\"cta\">\n      <span class=\"eyebrow rose\">The Next Step<\u002Fspan>\n      <h2>Want a <em>personalized review<\u002Fem> of your checklist results?<\u002Fh2>\n            <div class=\"cta-card\">\n        <div class=\"who\">\n          <div class=\"name\">Apply to <em>work together<\u002Fem><\u002Fdiv>\n          <div class=\"role\">Private-pay practices accepted on a rolling basis<\u002Fdiv>\n        <\u002Fdiv>\n        <a class=\"btn on-dark\" href=\"https://simplerabbit.studio/apply\" target=\"_blank\" rel=\"noopener\" id=\"apply-link\">Apply now →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<div class=\"reset-bar\" id=\"reset-bar\">\n  <span><span class=\"progress\" id=\"progress-count\">0<\u002Fspan> of 18 rated<\u002Fspan>\n  <button type=\"button\" id=\"reset-floating\">Clear All<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n(function () {\n  const SCALE = [1, 2, 3, 4, 5];\n  const items = Array.from(document.querySelectorAll('[data-item]'));\n\n  items.forEach((item, idx) => {\n    const host = item.querySelector('[data-rating]');\n    SCALE.forEach((n) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.textContent = n;\n      b.setAttribute('aria-label', `Rate item ${idx + 1} as ${n}`);\n      b.setAttribute('aria-pressed', 'false');\n      b.dataset.value = n;\n      b.addEventListener('click', () => setRating(item, n));\n      host.appendChild(b);\n    });\n  });\n\n  function setRating(item, n) {\n    const current = Number(item.dataset.value || 0);\n    const next = current === n ? 0 : n;\n    item.dataset.value = next;\n    item.classList.toggle('is-rated', next > 0);\n    item.classList.toggle('is-unrated', next === 0);\n    item.querySelectorAll('[data-rating] button').forEach((b) => {\n      const v = Number(b.dataset.value);\n      const active = v === next;\n      b.setAttribute('aria-pressed', active ? 'true' : 'false');\n      b.dataset.dim = next > 0 && !active ? 'true' : 'false';\n    });\n    recompute();\n  }\n\n  const verdictMap = {\n    excellent: \"You have a strong foundation.\",\n    good: \"Good bones — and a few leaks worth plugging.\",\n    average: \"Average today, significant runway tomorrow.\",\n    gaps: \"Major gaps — but every one of them is fixable.\",\n  };\n\n  function recompute() {\n    let total = 0;\n    let rated = 0;\n\n    document.querySelectorAll('.section[data-pillar]').forEach((sec) => {\n      let sub = 0;\n      sec.querySelectorAll('[data-item]').forEach((it) => {\n        const v = Number(it.dataset.value || 0);\n        sub += v;\n        if (v > 0) rated += 1;\n      });\n      total += sub;\n      const out = sec.querySelector('[data-pillar-score]');\n      if (out) out.textContent = sub;\n    });\n\n    document.getElementById('total-score').textContent = total;\n    document.getElementById('progress-count').textContent = rated;\n\n    // 18 items × 5 = 90; bands scaled from your 0-50 spec\n    let band = null;\n    if (rated === 0) band = null;\n    else if (total >= 72) band = 'excellent';\n    else if (total >= 54) band = 'good';\n    else if (total >= 36) band = 'average';\n    else band = 'gaps';\n\n    document.querySelectorAll('.band').forEach((b) => {\n      b.classList.toggle('is-active', b.dataset.band === band);\n    });\n\n    const verdict = document.getElementById('verdict-line');\n    verdict.textContent = band ? verdictMap[band] : \"Rate the items above to see where you land.\";\n\n    document.getElementById('reset-bar').classList.toggle('visible', rated > 0);\n  }\n\n  function reset() { items.forEach((it) => setRating(it, 0)); }\n  document.getElementById('reset-btn').addEventListener('click', reset);\n  document.getElementById('reset-floating').addEventListener('click', reset);\n  document.getElementById('print-btn').addEventListener('click', () => window.print());\n\n  recompute();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
