<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About Overlay Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --accent:#AA737D;--dark:#555;--black:#000;--white:#fff;--light-border:#dfe0e1;
    --font-display:'Raleway',sans-serif;
    --font-body:'DM Sans',system-ui,sans-serif;
    --font-mono:'DM Sans',sans-serif;
  }
  body{font-family:var(--font-body);background:#f0eeea;-webkit-font-smoothing:antialiased;padding:60px 80px;}
  .grid-2-center{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:center;}
  .about-deco{display:block;}
  @media(max-width:768px){
    .grid-2-center{grid-template-columns:1fr;}
    .about-deco{display:none;}
  }
  .overline{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:12px;}
</style>
</head>
<body>

<section style="padding:60px 48px;background:#fff;position:relative;">
  <div class="grid-2-center" style="max-width:1100px;margin:0 auto;position:relative;">
    <div style="position:relative;">
      <img src="Leann-3.jpg" alt="Leann Frank" style="width:100%;display:block;object-fit:cover;object-position:center top;aspect-ratio:3/4;max-height:600px;">
      <img src="Line icons/about-image.png" alt="" aria-hidden="true" class="about-deco" style="position:absolute;top:-20px;right:-150px;width:260px;height:auto;pointer-events:none;z-index:2;">
    </div>
    <div>
      <span class="overline">Hi, I&rsquo;m Leann</span>
      <h2 style="font-family:var(--font-display);font-size:36px;line-height:1.2;margin-bottom:28px;font-weight:400;">I started Simple Rabbit because too many practitioners I respected were being represented online by websites that didn&rsquo;t work.</h2>
      <p style="font-size:16px;line-height:1.75;color:var(--dark);">I work with a small number of practices at a time, because doing this well takes real attention.</p>
    </div>
  </div>
</section>

</body>
</html>
